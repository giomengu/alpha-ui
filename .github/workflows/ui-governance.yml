name: UI Governance
on:
  pull_request:
  push:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run ui:validate
      - run: npm test
      - run: npm run build
      - run: npm -w apps/demo run build
